<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3e8" />
  <meta name="description" content="SOMESTRA Healthy Cookbook - 30 เมนูอาหารคลีน" />
  <meta property="og:title" content="SOMESTRA Healthy Cookbook" />
  <meta property="og:description" content="30 เมนูอาหารคลีน อร่อยง่าย ได้ประโยชน์ ครบทุกสารอาหาร" />
  <meta property="og:image" content="page-01.jpg" />
  <title>SOMESTRA Healthy Cookbook</title>
  <style>
    :root{
      --cream:#f7f3e8;
      --cream-2:#efe8d7;
      --paper:#fffdf8;
      --green:#506b1a;
      --green-2:#6e8b2d;
      --ink:#23301e;
      --muted:#69725f;
      --line:rgba(61,78,38,.15);
      --shadow:0 28px 80px rgba(49,55,34,.18),0 6px 20px rgba(49,55,34,.08);
      --radius:16px;
      --toolbar-h:64px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Thai",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 20% 15%,rgba(125,157,61,.09),transparent 28%),
        radial-gradient(circle at 85% 82%,rgba(173,126,67,.07),transparent 26%),
        linear-gradient(135deg,var(--cream),#fbf8f0 50%,var(--cream-2));
      overflow:hidden;
    }
    button,input{font:inherit}
    button{border:0}
    .app{height:100%;display:flex;flex-direction:column}
    .topbar{
      height:72px;min-height:72px;display:flex;align-items:center;justify-content:space-between;
      padding:0 22px;border-bottom:1px solid var(--line);background:rgba(250,247,238,.86);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20
    }
    .brand{display:flex;align-items:center;gap:14px;min-width:0}
    .brandmark{
      width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
      background:linear-gradient(145deg,var(--green-2),var(--green));color:white;
      box-shadow:0 7px 18px rgba(80,107,26,.22);font-weight:800;letter-spacing:.02em
    }
    .brandtext{min-width:0}
    .brandname{font-size:17px;line-height:1;font-weight:800;letter-spacing:.08em;color:var(--green)}
    .subtitle{margin-top:5px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-actions{display:flex;align-items:center;gap:8px}
    .iconbtn{
      width:40px;height:40px;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;
      display:grid;place-items:center;transition:.18s ease
    }
    .iconbtn:hover{background:rgba(80,107,26,.08);color:var(--green)}
    .iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    .stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:28px 78px calc(var(--toolbar-h) + 28px)}
    .book-scene{position:relative;width:min(1120px,calc(100vw - 170px));height:min(calc(100vh - 190px),790px);perspective:2200px;transition:transform .22s ease,filter .22s ease}
    .book-scene.flip-next{animation:flipNext .38s cubic-bezier(.24,.7,.25,1)}
    .book-scene.flip-prev{animation:flipPrev .38s cubic-bezier(.24,.7,.25,1)}
    @keyframes flipNext{0%{transform:rotateY(0) scale(1)}45%{transform:rotateY(-4deg) translateX(-.8%) scale(.988)}100%{transform:rotateY(0) scale(1)}}
    @keyframes flipPrev{0%{transform:rotateY(0) scale(1)}45%{transform:rotateY(4deg) translateX(.8%) scale(.988)}100%{transform:rotateY(0) scale(1)}}
    .spread{height:100%;width:100%;display:flex;align-items:center;justify-content:center;gap:0;position:relative;transform-style:preserve-3d}
    .page{
      height:100%;max-width:50%;aspect-ratio:993/1404;background:var(--paper);overflow:hidden;position:relative;
      box-shadow:var(--shadow);transition:transform .28s ease,box-shadow .28s ease;user-select:none;-webkit-user-drag:none
    }
    .page.left{border-radius:var(--radius) 2px 2px var(--radius);transform-origin:right center}
    .page.right{border-radius:2px var(--radius) var(--radius) 2px;transform-origin:left center}
    .page img{width:100%;height:100%;display:block;object-fit:contain;background:white;pointer-events:none}
    .page.left:after,.page.right:before{content:"";position:absolute;top:0;bottom:0;width:7%;pointer-events:none;z-index:2}
    .page.left:after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.08))}
    .page.right:before{left:0;background:linear-gradient(90deg,rgba(0,0,0,.08),transparent)}
    .spread.cover .page{max-width:50%;border-radius:var(--radius);box-shadow:0 34px 90px rgba(49,55,34,.22),0 8px 25px rgba(49,55,34,.1)}
    .spread.cover .page:before,.spread.cover .page:after{display:none}
    .spread.single-end .page{border-radius:var(--radius)}
    .gutter{position:absolute;top:2%;bottom:2%;left:50%;width:1px;background:rgba(0,0,0,.08);z-index:3;box-shadow:0 0 16px rgba(0,0,0,.12)}
    .cover .gutter,.single-end .gutter{display:none}

    .nav-arrow{
      position:absolute;top:50%;transform:translateY(-50%);width:48px;height:72px;border-radius:18px;
      background:rgba(255,253,248,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      box-shadow:0 10px 30px rgba(52,62,35,.12);color:var(--green);display:grid;place-items:center;cursor:pointer;z-index:7;
      border:1px solid rgba(80,107,26,.12);transition:.18s ease
    }
    .nav-arrow:hover{background:#fff;transform:translateY(-50%) scale(1.04)}
    .nav-arrow:disabled{opacity:.24;cursor:default;transform:translateY(-50%)}
    .nav-arrow.prev{left:18px}.nav-arrow.next{right:18px}
    .nav-arrow svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .toolbar{
      position:absolute;bottom:18px;left:50%;transform:translateX(-50%);height:var(--toolbar-h);
      display:flex;align-items:center;gap:4px;padding:8px 10px;border:1px solid rgba(80,107,26,.12);
      border-radius:20px;background:rgba(255,253,248,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      box-shadow:0 16px 46px rgba(50,59,35,.15);z-index:12
    }
    .toolbtn{height:46px;min-width:46px;padding:0 12px;border-radius:13px;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
    .toolbtn:hover{background:rgba(80,107,26,.09);color:var(--green)}
    .toolbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .divider{width:1px;height:28px;background:var(--line);margin:0 3px}
    .page-indicator{display:flex;align-items:center;gap:7px;padding:0 8px;color:var(--muted);font-size:13px;white-space:nowrap}
    .page-input{width:44px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;color:var(--ink);outline:none}
    .page-input:focus{border-color:rgba(80,107,26,.5);box-shadow:0 0 0 3px rgba(80,107,26,.08)}

    .drawer{position:absolute;inset:72px auto 0 0;width:280px;background:rgba(250,247,238,.97);border-right:1px solid var(--line);z-index:15;transform:translateX(-101%);transition:transform .24s ease;box-shadow:18px 0 50px rgba(44,54,31,.08);display:flex;flex-direction:column}
    .drawer.open{transform:translateX(0)}
    .drawer-head{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between}
    .drawer-title{font-weight:750;color:var(--green)}
    .thumbs{overflow:auto;padding:6px 16px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;scrollbar-width:thin}
    .thumb{background:transparent;border-radius:10px;padding:0;cursor:pointer;text-align:center;color:var(--muted)}
    .thumb img{width:100%;aspect-ratio:993/1404;object-fit:cover;background:white;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.08);border:2px solid transparent;transition:.17s}
    .thumb.active img{border-color:var(--green);box-shadow:0 6px 18px rgba(80,107,26,.18)}
    .thumb span{font-size:11px;display:block;margin-top:5px}

    .zoom-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pan-x pan-y;scrollbar-width:thin}
    .zoom-wrap.zoomed{align-items:flex-start;justify-content:flex-start;padding:24px}
    .zoom-wrap.zoomed .book-scene{flex:0 0 auto}
    .hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(255,255,255,.66);padding:7px 11px;border-radius:999px;border:1px solid rgba(80,107,26,.09);opacity:0;animation:hint 4s ease .5s both;pointer-events:none;z-index:5}
    @keyframes hint{0%{opacity:0;transform:translate(-50%,-4px)}15%,68%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

    .loader{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--cream),#fbf8f0);z-index:50;transition:opacity .35s ease,visibility .35s ease}
    .loader.hide{opacity:0;visibility:hidden}
    .loader-card{text-align:center}
    .loader-logo{width:54px;height:54px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(145deg,var(--green-2),var(--green));display:grid;place-items:center;color:white;font-weight:800;font-size:19px;box-shadow:0 12px 28px rgba(80,107,26,.22)}
    .loader-title{font-weight:800;letter-spacing:.06em;color:var(--green)}
    .loader-sub{font-size:12px;color:var(--muted);margin-top:6px}
    .progress{width:180px;height:3px;border-radius:999px;background:rgba(80,107,26,.12);overflow:hidden;margin:17px auto 0}
    .progress i{display:block;width:36%;height:100%;background:var(--green);border-radius:inherit;animation:load 1s ease-in-out infinite alternate}
    @keyframes load{from{transform:translateX(-70%)}to{transform:translateX(230%)}}

    @media (max-width:760px){
      :root{--toolbar-h:58px}
      .topbar{height:62px;min-height:62px;padding:0 12px}
      .brandmark{width:34px;height:34px;border-radius:10px;font-size:14px}
      .brandname{font-size:15px}.subtitle{font-size:11px;max-width:190px}
      .top-actions .iconbtn:first-child{display:none}
      .stage{padding:14px 12px calc(var(--toolbar-h) + 22px)}
      .book-scene{width:100%;height:calc(100vh - 152px);max-height:none}
      .spread{display:block}
      .page{height:100%;max-width:100%;width:auto;margin:0 auto;border-radius:12px!important;box-shadow:0 18px 52px rgba(49,55,34,.18)}
      .page.left:after,.page.right:before,.gutter{display:none}
      .page.hidden-mobile{display:none}
      .nav-arrow{width:40px;height:62px;border-radius:15px;background:rgba(255,253,248,.82)}
      .nav-arrow.prev{left:5px}.nav-arrow.next{right:5px}
      .toolbar{bottom:10px;max-width:calc(100vw - 18px);height:58px;padding:6px 7px;border-radius:18px;gap:1px}
      .toolbtn{height:44px;min-width:42px;padding:0 9px}
      .toolbtn .label{display:none}
      .divider.hide-mobile{display:none}
      .page-indicator{font-size:12px;padding:0 4px;gap:5px}.page-input{width:38px;height:31px}
      .drawer{inset:62px auto 0 0;width:min(86vw,320px)}
      .hint{top:8px}
    }
    @media (max-width:430px){
      .brandmark{display:none}.subtitle{max-width:160px}.toolbtn{min-width:38px;padding:0 7px}.toolbar{gap:0}.page-indicator{padding:0 2px}.page-input{width:35px}.divider{margin:0 1px}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brandmark">S</div>
      <div class="brandtext">
        <div class="brandname">SOMESTRÁ</div>
        <div class="subtitle">Healthy Cookbook · 30 เมนูอาหารคลีน</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="iconbtn" id="homeBtn" title="กลับหน้าปก" aria-label="กลับหน้าปก">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/><path d="M9.5 19v-5h5v5"/></svg>
      </button>
      <button class="iconbtn" id="fullscreenTop" title="เต็มจอ" aria-label="เต็มจอ">
        <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
      </button>
    </div>
  </header>

  <aside class="drawer" id="drawer" aria-label="ภาพตัวอย่างทุกหน้า">
    <div class="drawer-head"><div class="drawer-title">สารบัญภาพ</div><button class="iconbtn" id="closeDrawer" aria-label="ปิด"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div class="thumbs" id="thumbs"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="hint">ปัดซ้าย-ขวา หรือใช้ปุ่มลูกศรเพื่อพลิกหน้า</div>
    <button class="nav-arrow prev" id="prevBtn" aria-label="หน้าก่อนหน้า"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="zoom-wrap" id="zoomWrap">
      <div class="book-scene" id="bookScene"><div class="spread" id="spread"></div></div>
    </div>
    <button class="nav-arrow next" id="nextBtn" aria-label="หน้าถัดไป"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>

    <div class="toolbar" role="toolbar" aria-label="เครื่องมืออ่าน E-Book">
      <button class="toolbtn" id="thumbBtn" title="ภาพตัวอย่าง"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span class="label">หน้า</span></button>
      <div class="divider"></div>
      <button class="toolbtn" id="zoomOut" title="ย่อ"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8.5 11h5M16 16l4 4"/></svg></button>
      <button class="toolbtn" id="zoomIn" title="ขยาย"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8.5 11h5M11 8.5v5M16 16l4 4"/></svg></button>
      <div class="divider hide-mobile"></div>
      <div class="page-indicator"><input class="page-input" id="pageInput" inputmode="numeric" value="1" aria-label="หมายเลขหน้า"/><span>/ 31</span></div>
      <div class="divider"></div>
      <button class="toolbtn" id="fullscreenBtn" title="เต็มจอ"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
    </div>
  </main>

  <div class="loader" id="loader"><div class="loader-card"><div class="loader-logo">S</div><div class="loader-title">SOMESTRÁ</div><div class="loader-sub">กำลังเปิด Healthy Cookbook</div><div class="progress"><i></i></div></div></div>
</div>
<script>
(() => {
  const TOTAL = 31;
  let currentPage = 1;
  let zoom = 1;
  let animating = false;
  const isMobile = () => matchMedia('(max-width:760px)').matches;

  const spread = document.getElementById('spread');
  const scene = document.getElementById('bookScene');
  const zoomWrap = document.getElementById('zoomWrap');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageInput = document.getElementById('pageInput');
  const drawer = document.getElementById('drawer');
  const thumbs = document.getElementById('thumbs');
  const loader = document.getElementById('loader');

  const src = n => `page-${String(n).padStart(2,'0')}.jpg`;
  const makePage = (n, side='right') => {
    const el = document.createElement('div');
    el.className = `page ${side}`;
    const img = document.createElement('img');
    img.src = src(n); img.alt = `หน้า ${n}`; img.draggable = false;
    el.appendChild(img); return el;
  };

  function desktopSpreadFor(page){
    if(page <= 1) return [null,1];
    const left = page % 2 === 0 ? page : page - 1;
    return [left, left + 1 <= TOTAL ? left + 1 : null];
  }

  function render(){
    spread.innerHTML = '';
    spread.className = 'spread';
    if(isMobile()){
      spread.appendChild(makePage(currentPage,'right'));
    } else {
      const [left,right] = desktopSpreadFor(currentPage);
      if(currentPage === 1){
        spread.classList.add('cover');
        spread.appendChild(makePage(1,'right'));
      } else {
        if(left) spread.appendChild(makePage(left,'left'));
        if(right) spread.appendChild(makePage(right,'right'));
        if(!left || !right) spread.classList.add('single-end');
        const gutter = document.createElement('div'); gutter.className='gutter'; spread.appendChild(gutter);
      }
    }
    pageInput.value = currentPage;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= TOTAL;
    updateThumbActive();
    preloadAround();
  }

  function goTo(page, direction){
    page = Math.max(1, Math.min(TOTAL, Number(page)||1));
    if(page === currentPage || animating) return;
    animating = true;
    const cls = direction || (page > currentPage ? 'next' : 'prev');
    scene.classList.remove('flip-next','flip-prev');
    void scene.offsetWidth;
    scene.classList.add(cls === 'next' ? 'flip-next' : 'flip-prev');
    setTimeout(() => { currentPage = page; render(); }, 150);
    setTimeout(() => { scene.classList.remove('flip-next','flip-prev'); animating = false; }, 390);
  }

  function next(){
    if(isMobile()) return goTo(currentPage + 1,'next');
    if(currentPage === 1) return goTo(2,'next');
    const [,r] = desktopSpreadFor(currentPage);
    goTo(Math.min(TOTAL,(r||currentPage)+1),'next');
  }
  function prev(){
    if(isMobile()) return goTo(currentPage - 1,'prev');
    if(currentPage <= 2) return goTo(1,'prev');
    const [l] = desktopSpreadFor(currentPage);
    goTo(Math.max(1,(l||currentPage)-2),'prev');
  }

  function setZoom(next){
    zoom = Math.max(.75, Math.min(2.1, next));
    scene.style.transform = `scale(${zoom})`;
    scene.style.transformOrigin = 'center center';
    zoomWrap.classList.toggle('zoomed', zoom > 1.02);
    if(zoom <= 1.02){ zoomWrap.scrollTop = 0; zoomWrap.scrollLeft = 0; }
  }

  function preloadAround(){
    const nums = [currentPage-2,currentPage-1,currentPage+1,currentPage+2,currentPage+3].filter(n=>n>=1&&n<=TOTAL);
    nums.forEach(n=>{ const i=new Image(); i.src=src(n); });
  }

  function buildThumbs(){
    const frag = document.createDocumentFragment();
    for(let n=1;n<=TOTAL;n++){
      const b=document.createElement('button'); b.className='thumb'; b.dataset.page=n;
      const img=document.createElement('img'); img.loading='lazy'; img.src=src(n); img.alt=`หน้า ${n}`;
      const s=document.createElement('span'); s.textContent=`หน้า ${n}`;
      b.append(img,s); b.addEventListener('click',()=>{goTo(n);drawer.classList.remove('open')}); frag.appendChild(b);
    }
    thumbs.appendChild(frag); updateThumbActive();
  }
  function updateThumbActive(){
    document.querySelectorAll('.thumb').forEach(el=>el.classList.toggle('active',Number(el.dataset.page)===currentPage));
  }

  prevBtn.addEventListener('click',prev); nextBtn.addEventListener('click',next);
  document.getElementById('homeBtn').addEventListener('click',()=>goTo(1,'prev'));
  document.getElementById('thumbBtn').addEventListener('click',()=>drawer.classList.toggle('open'));
  document.getElementById('closeDrawer').addEventListener('click',()=>drawer.classList.remove('open'));
  document.getElementById('zoomIn').addEventListener('click',()=>setZoom(zoom+.2));
  document.getElementById('zoomOut').addEventListener('click',()=>setZoom(zoom-.2));
  pageInput.addEventListener('change',()=>goTo(pageInput.value));
  pageInput.addEventListener('keydown',e=>{if(e.key==='Enter'){goTo(pageInput.value);pageInput.blur()}});

  async function toggleFullscreen(){
    try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }catch(e){}
  }
  document.getElementById('fullscreenBtn').addEventListener('click',toggleFullscreen);
  document.getElementById('fullscreenTop').addEventListener('click',toggleFullscreen);

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='PageDown') next();
    if(e.key==='ArrowLeft'||e.key==='PageUp') prev();
    if(e.key==='Home') goTo(1,'prev');
    if(e.key==='End') goTo(TOTAL,'next');
    if(e.key==='Escape') drawer.classList.remove('open');
  });

  let startX=0,startY=0;
  zoomWrap.addEventListener('touchstart',e=>{if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY}},{passive:true});
  zoomWrap.addEventListener('touchend',e=>{
    if(zoom>1.02||!e.changedTouches[0]) return;
    const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){dx<0?next():prev()}
  },{passive:true});

  window.addEventListener('resize',()=>{setZoom(1);render()});
  document.addEventListener('click',e=>{if(drawer.classList.contains('open')&&!drawer.contains(e.target)&&!document.getElementById('thumbBtn').contains(e.target))drawer.classList.remove('open')});

  const cover = new Image(); cover.onload=()=>{setTimeout(()=>loader.classList.add('hide'),180)}; cover.onerror=()=>loader.classList.add('hide'); cover.src=src(1);
  buildThumbs(); render();
})();
</script>
</body>
</html>
